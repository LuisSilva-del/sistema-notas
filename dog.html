<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetAdopt</title>
    <style>
        /* --- CONFIGURAÇÕES GERAIS E PALETA DE CORES --- */
        :root {
            --bg-principal: #FFF5E4;
            --bg-card-branco: #FFFFFF;
            --cor-texto-escura: #000000;
            --cor-texto-suave: #666666;
            --cor-botao-principal: #DDBEAA;
            --cor-botao-adotar: #E8A57C;
            --cor-ong-box: #4A2E1B;
            
            /* Cores dos Cards da Lista */
            --card-bobi: #FFEAD2;
            --card-mel: #D8F3DC;
            --card-rex: #E8E8F4;
            --card-nina: #FCE1EE;
            --card-thor: #FDF0D5;
            --card-mingal: #FFDCA9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- MOCKUP DO SMARTPHONE --- */
        .phone-container {
            width: 390px;
            height: 844px;
            background-color: var(--bg-principal);
            border: 12px solid #1a1a1a;
            border-radius: 45px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ilha Dinâmica (Dynamic Island) */
        .dynamic-island {
            width: 110px;
            height: 30px;
            background-color: #000;
            border-radius: 20px;
            margin: 15px auto 5px auto;
            z-index: 10;
            flex-shrink: 0;
        }

        /* Área de Conteúdo Interno */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            padding-bottom: 80px; /* Espaço para a barra de navegação */
        }

        /* Ocultar barra de rolagem visualmente */
        .screen-content::-webkit-scrollbar {
            width: 0px;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ELEMENTOS DE DECORAÇÃO (PATAS DE FUNDO) --- */
        .bg-decor {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            pointer-events: none;
            user-select: none;
        }

        /* --- TELA 1: LOGIN / HOME INICIAL --- */
        .logo-section {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            background-color: #F7C893;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            margin: 0 auto 15px auto;
        }

        .logo-section h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--cor-texto-escura);
        }

        .logo-section p {
            font-size: 14px;
            font-style: italic;
            color: var(--cor-texto-suave);
            margin-top: 5px;
        }

        .login-card {
            background-color: var(--bg-card-branco);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .login-card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group {
            background-color: #FDF6EE;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        .input-group span {
            font-size: 18px;
            margin-right: 10px;
        }

        .input-group input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
            color: var(--cor-texto-escura);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--cor-botao-principal);
            color: #FFF;
        }

        .btn-primary:hover {
            background-color: #cbb09d;
        }

        .login-footer-text {
            font-size: 11px;
            color: #A3A3A3;
            margin-top: 20px;
        }

        .login-footer-text strong {
            color: #F7C893;
        }

        .animal-icons-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 80px;
            font-size: 24px;
        }

        /* --- TELA 2: LISTA DE PETS --- */
        .welcome-header {
            margin-bottom: 20px;
        }

        .welcome-header span {
            font-size: 14px;
            color: var(--cor-texto-suave);
        }

        .welcome-header h2 {
            font-size: 26px;
            font-weight: bold;
            color: var(--cor-texto-escura);
            margin-top: 2px;
        }

        .pet-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pet-card {
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .pet-card:hover {
            transform: scale(1.02);
        }

        .pet-info-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pet-avatar {
            width: 60px;
            height: 60px;
            background: #FFF;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .pet-details h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 2px;
        }

        .pet-details p {
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        .pet-location {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .arrow-btn {
            width: 32px;
            height: 32px;
            background: #FFF;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* --- TELA 3: DETALHES DO PET --- */
        .pet-detail-header {
            position: relative;
            margin-bottom: 20px;
        }

        .fav-heart {
            position: absolute;
            top: 0;
            right: 0;
            background: #FFF;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .detail-avatar-circle {
            width: 110px;
            height: 110px;
            background-color: #FFF;
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .pet-specs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .spec-box {
            background-color: var(--bg-card-branco);
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .spec-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .spec-label {
            font-size: 11px;
            color: #A0A0A0;
            font-weight: 500;
        }

        .spec-value {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-top: 2px;
        }

        .info-section-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--cor-texto-escura);
            margin-bottom: 8px;
        }

        .info-text-box {
            background-color: var(--bg-card-branco);
            border-radius: 15px;
            padding: 15px;
            min-height: 55px;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .ong-card {
            background-color: var(--cor-ong-box);
            border-radius: 18px;
            padding: 15px;
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .ong-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ong-icon {
            font-size: 28px;
        }

        .ong-name h4 {
            font-size: 15px;
            font-weight: bold;
        }

        .ong-name p {
            font-size: 11px;
            color: #DDBEAA;
            margin-top: 2px;
        }

        .chat-btn {
            width: 40px;
            height: 40px;
            background-color: #E6C5AC;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-adopt {
            background-color: var(--cor-botao-adotar);
            color: #FFF;
        }
        
        .btn-adopt:hover {
            background-color: #dc9265;
        }

        /* --- BARRA DE NAVEGAÇÃO INFERIOR --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #E9ECEF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-top: 1px solid #DCDCDC;
            z-index: 10;
        }

        .nav-item {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            background: none;
            border: none;
            outline: none;
        }

        .nav-item:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="dynamic-island"></div>

        <div class="bg-decor" style="top: 60px; left: 20px;">🐾</div>
        <div class="bg-decor" style="top: 160px; right: 20px;">🐾</div>
        <div class="bg-decor" style="top: 280px; left: 30px;">🐾</div>
        <div class="bg-decor" style="bottom: 120px; left: 25px;">🐾</div>
        <div class="bg-decor" style="bottom: 220px; right: 25px;">🐾</div>

        <div class="screen-content">

            <div id="screen-login" class="screen active">
                <div class="logo-section">
                    <div class="logo-circle">🐾</div>
                    <h1>PetAdopt</h1>
                    <p>Todo pet merece um lar cheio de amor</p>
                </div>

                <div class="login-card">
                    <h2>Olá, quem é você?</h2>
                    <div class="input-group">
                        <span>✏️</span>
                        <input type="text" id="username-input" placeholder="Seu nome aqui..." value="Luis">
                    </div>
                    <button class="btn btn-primary" onclick="realizarLogin()">
                        Encontrar meu pet 🐶
                    </button>
                    <p class="login-footer-text">Mais de <strong>120 pets</strong> aguardando adoção</p>
                </div>

                <div class="animal-icons-row">
                    <span>🐶</span><span>🐱</span><span>🐰</span><span>🐹</span><span>🐾</span>
                </div>
            </div>


            <div id="screen-list" class="screen">
                <div class="welcome-header">
                    <span id="welcome-text">Olá, Luis👋</span>
                    <h2>Encontre seu novo amigo</h2>
                </div>

                <div class="pet-list" id="container-lista-pets">
                    </div>
            </div>


            <div id="screen-detail" class="screen">
                <div class="pet-detail-header">
                    <div class="fav-heart">🩵</div>
                    <div class="detail-avatar-circle" id="detail-avatar">🐶</div>
                </div>

                <div class="pet-specs-grid">
                    <div class="spec-box">
                        <div class="spec-icon">🎂</div>
                        <div class="spec-label">Idade</div>
                        <div class="spec-value" id="detail-age">-</div>
                    </div>
                    <div class="spec-box">
                        <div class="spec-icon">📏</div>
                        <div class="spec-label">Porte</div>
                        <div class="spec-value" id="detail-size">-</div>
                    </div>
                    <div class="spec-box">
                        <div class="spec-icon">⚖️</div>
                        <div class="spec-label">Peso</div>
                        <div class="spec-value" id="detail-weight">-</div>
                    </div>
                    <div class="spec-box">
                        <div class="spec-icon">🐾</div>
                        <div class="spec-label">Espécie</div>
                        <div class="spec-value" id="detail-species">-</div>
                    </div>
                </div>

                <h3 class="info-section-title">Sobre</h3>
                <div class="info-text-box" id="detail-about">
                    </div>

                <h3 class="info-section-title">Saúde & Cuidados</h3>
                <div class="info-text-box" id="detail-health">
                    </div>

                <div class="ong-card">
                    <div class="ong-info">
                        <div class="ong-icon">🏡</div>
                        <div class="ong-name">
                            <h4>ONG Amor Animal</h4>
                            <p>Responsável por</p>
                        </div>
                    </div>
                    <div class="chat-btn" onclick="alert('Abrindo chat com a ONG...')">💬</div>
                </div>

                <button class="btn btn-adopt" onclick="alert('Obrigado pelo interesse! A ONG entrará em contato.')">
                    Quero adotar 🐾
                </button>
            </div>

        </div>

        <div class="bottom-nav" id="app-nav" style="display: none;">
            <button class="nav-item" id="nav-left-btn" onclick="voltarParaLista()">🔍</button>
            <button class="nav-item" onclick="logout()">🚪</button>
        </div>
    </div>

    <script>
        // Banco de dados simulado dos pets baseados no seu print
        const petsData = [
            { id: 1, name: "Bobi", type: "Cachorro", age: "2 anos", location: "Osvaldo Cruz", avatar: "🐶", color: "var(--card-bobi)", size: "Médio", weight: "12kg", species: "Canina", about: "Bobi é extremamente brincalhão, ideal para casas com quintal e crianças.", health: "Vacinado, castrado e vermifugado em dia." },
            { id: 2, name: "Mel", type: "Gato", age: "2 anos", location: "Osvaldo Cruz", avatar: "🐱", color: "var(--card-mel)", size: "Pequeno", weight: "4kg", species: "Felina", about: "Mel é uma gatinha calma que adora um colo e passar a tarde dormindo no sol.", health: "Castrada, testada FIV/FELV negativo." },
            { id: 3, name: "Rex", type: "Cachorro", age: "4 anos", location: "Osvaldo Cruz", avatar: "🐶", color: "var(--card-rex)", size: "Grande", weight: "28kg", species: "Canina", about: "Rex é um ótimo cão de guarda, muito dócil com os donos e super obediente.", health: "Vacinado V10 e Antirrábica, microchipado." },
            { id: 4, name: "Nina", type: "Coelho", age: "1 ano", location: "Osvaldo Cruz", avatar: "🐰", color: "var(--card-nina)", size: "Pequeno", weight: "1.5kg", species: "Roedor", about: "Nina adora comer cenouras e passear pela casa sob supervisão.", health: "Super saudável, dentes bem cuidados." },
            { id: 5, name: "Thor", type: "Cachorro", age: "8 meses", location: "Osvaldo Cruz", avatar: "🐶", color: "var(--card-thor)", size: "Médio", weight: "9kg", species: "Canina", about: "Thor é um filhotão cheio de energia procurando uma família ativa.", health: "Tomou as primeiras vacinas de filhote." },
            { id: 6, name: "Mingal", type: "Gato", age: "2 anos", location: "Osvaldo Cruz", avatar: "🐱", color: "var(--card-mingal)", size: "Pequeno", weight: "4.5kg", species: "Felina", about: "Mingal é sociável e se dá muito bem com outros gatos.", health: "Vacinado e castrado." }
        ];

        // Mapeia a troca de telas
        function navegarPara(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            const nav = document.getElementById('app-nav');
            const leftBtn = document.getElementById('nav-left-btn');

            if(screenId === 'screen-login') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'flex';
                // Altera o ícone inferior esquerdo com base na tela ativa
                if(screenId === 'screen-detail') {
                    leftBtn.innerText = '🔍'; // Clicar aqui volta para busca/lista
                } else {
                    leftBtn.innerText = '👤'; // Ícone de perfil na listagem (conforme print 3)
                }
            }
        }

        // Ação de Login (Tela 1 -> Tela 2)
        function realizarLogin() {
            const nome = document.getElementById('username-input').value.trim() || 'Usuário';
            document.getElementById('welcome-text').innerText = `Olá, ${nome}👋`;
            
            renderizarListaPets();
            navegarPara('screen-list');
        }

        // Renderiza dinamicamente os cartões na Tela 2
        function renderizarListaPets() {
            const container = document.getElementById('container-lista-pets');
            container.innerHTML = '';

            petsData.forEach(pet => {
                const card = document.createElement('div');
                card.className = 'pet-card';
                card.style.backgroundColor = pet.color;
                card.onclick = () => verDetalhesPet(pet.id);

                card.innerHTML = `
                    <div class="pet-info-block">
                        <div class="pet-avatar">${pet.avatar}</div>
                        <div class="pet-details">
                            <h3>${pet.name}</h3>
                            <p>${pet.type} - ${pet.age}</p>
                            <div class="pet-location">📍 ${pet.location}</div>
                        </div>
                    </div>
                    <div class="arrow-btn">➔</div>
                `;
                container.appendChild(card);
            });
        }

        // Carrega as informações na Tela 3 de detalhes
        function verDetalhesPet(id) {
            const pet = petsData.find(p => p.id === id);
            if(!pet) return;

            document.getElementById('detail-avatar').innerText = pet.avatar;
            document.getElementById('detail-age').innerText = pet.age;
            document.getElementById('detail-size').innerText = pet.size;
            document.getElementById('detail-weight').innerText = pet.weight;
            document.getElementById('detail-species').innerText = pet.species;
            document.getElementById('detail-about').innerText = pet.about;
            document.getElementById('detail-health').innerText = pet.health;

            navegarPara('screen-detail');
        }

        function voltarParaLista() {
            navegarPara('screen-list');
        }

        function logout() {
            navegarPara('screen-login');
        }
    </script>
</body>
</html>
